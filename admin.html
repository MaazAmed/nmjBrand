<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>NMJ Admin</title>
<style>
:root{--bg:#f0f2f1;--side:#0a2c1f;--side2:#12402d;--gold:#d9a441;--gold2:#ecc77a;--tx:#1d2327;--mut:#646970;--ln:#dcdfde;--ok:#1a7f4b;--warn:#b26a00;--bad:#b32d2e}
*{box-sizing:border-box;margin:0}
body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);background:#fff;border-radius:6px;padding:7px 14px;cursor:pointer;transition:.15s;text-decoration:none}
.btn:hover{border-color:#999}
.btn.p{background:var(--side);border-color:var(--side);color:#fff}.btn.p:hover{background:var(--side2)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:600}.btn.g:hover{background:var(--gold2)}
.btn.d{color:var(--bad);border-color:#e7b9b9}.btn.d:hover{background:#fbeaea}
.btn.sm{padding:3px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;border:1px solid #b9bfbd;border-radius:6px;padding:8px 10px;background:#fff}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:1px solid var(--gold)}
label.f{display:block;font-weight:600;margin:14px 0 4px}
small.h{display:block;color:var(--mut);font-weight:400;margin-top:3px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#12663f,#082a1d 70%);padding:20px}
#login form{background:#fff;border-radius:14px;padding:30px;width:min(380px,100%);box-shadow:0 30px 60px -20px rgba(0,0,0,.6);text-align:center}
#login img{height:120px;margin:-6px auto 6px;display:block;background:#0a2c1f;border-radius:12px;padding:6px 14px}
#login h1{font-size:20px;margin:8px 0 14px}
#login .err{color:var(--bad);min-height:20px;margin-top:8px}

/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:#d8e6dd;padding:14px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
aside .brand{display:flex;align-items:center;gap:10px;padding:4px 18px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
aside .brand img{height:40px;width:auto}
aside .brand b{color:var(--gold2);font-size:15px;line-height:1.2}
aside nav a{display:flex;align-items:center;gap:10px;padding:10px 18px;color:#cfe0d5;text-decoration:none;cursor:pointer;border-left:3px solid transparent}
aside nav a:hover{background:var(--side2);color:#fff}
aside nav a.on{background:var(--side2);color:#fff;border-left-color:var(--gold)}
aside .bot{margin-top:auto;padding:12px 18px;font-size:13px}
aside .bot a{color:var(--gold2);cursor:pointer;display:block;margin:4px 0}
main{padding:0 28px 60px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;flex-wrap:wrap}
h2.t{font-size:23px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600}
.pill.ok{background:#dff3e8;color:var(--ok)}.pill.dr{background:#eceeed;color:var(--mut)}.pill.so{background:#fbe5e5;color:var(--bad)}.pill.w{background:#fff1d6;color:var(--warn)}
.box{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:18px;margin-bottom:18px}
.box h3{font-size:15px;margin-bottom:6px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--ln);border-radius:10px;padding:16px}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:600}.stat span{color:var(--mut)}
.bars div{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center;margin:8px 0}
.bars i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.warn{background:#fff6e0;border:1px solid #f0d48a;border-radius:10px;padding:12px 16px;margin-bottom:18px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools input{max-width:280px}.tools select{max-width:190px}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.tbl th{text-align:left;background:#f6f7f7;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--ln);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #eceeed;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}.tbl tr:hover td{background:#fafcfb}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#f3ede0;display:grid;place-items:center;font-size:22px}
.tw{overflow-x:auto;border-radius:10px}
.tbl s{color:var(--mut);margin-right:4px}
.row2{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
#imgprev{border:2px dashed #b9bfbd;border-radius:10px;min-height:150px;display:grid;place-items:center;text-align:center;padding:10px;color:var(--mut);cursor:pointer}
#imgprev:hover{border-color:var(--gold)}#imgprev img{max-width:100%;max-height:200px;border-radius:8px}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-weight:600}.chk input{width:auto}
#toast{position:fixed;right:20px;bottom:20px;background:#1d2327;color:#fff;padding:10px 18px;border-radius:8px;transform:translateY(90px);transition:.3s;z-index:50}
#toast.on{transform:none}
ol.st{padding-left:20px}ol.st li{margin:6px 0}
code{background:#eef1f0;padding:1px 6px;border-radius:4px}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
 aside .brand{border:0;padding:0 10px 0 6px;margin:0}
 aside nav{display:flex;overflow-x:auto;flex:1}aside nav a{padding:10px 12px;border-left:0;border-bottom:3px solid transparent;white-space:nowrap}
 aside nav a.on{border-bottom-color:var(--gold)}
 aside .bot{display:none}
 main{padding:0 14px 60px}.row2{grid-template-columns:1fr}.two{grid-template-columns:1fr}
}
</style>
</head>

 $("#lf").onsubmit=function(e){e.preventDefault();var v=$("#pw").value;

/* ---------- auto publish ---------- */
var AK="nmj_auto",pubTimer=null,pubBusy=false;
function acfg(){try{return JSON.parse(localStorage.getItem(AK))||{}}catch(e){return{}}}
function autoOn(){var c=acfg();return !!((c.mode==="github"&&c.repo&&c.token)||(c.mode==="server"&&c.url))}
function autoNote(){var c=acfg();return autoOn()?'<b style="color:#16794a">Auto-publish is ON</b> ('+(c.mode==="github"?"GitHub":"your own server")+'). Every change you save here goes live on the website by itself within a few seconds. Click <b>Publish now</b> if it ever fails.':'Auto-publish is OFF. Turn it on in <a href="#" data-go="settings" style="text-decoration:underline">Settings &rarr; Auto publish</a> so the website updates by itself.'}
function schedPub(){if(!autoOn())return;clearTimeout(pubTimer);pubTimer=setTimeout(function(){pubNow(true)},1500)}
function b64(t){return btoa(unescape(encodeURIComponent(t)))}
function pubNow(quiet){var c=acfg();
 if(!autoOn()){if(!quiet)alert("Auto publish is not set up yet. Go to Settings and fill in Auto publish.");return Promise.resolve(false)}
 if(pubBusy){schedPub();return Promise.resolve(false)}
 pubBusy=true;var stamp=D.updated||Date.now(),body=JSON.stringify(D),job;toast("Publishing to website...");
 if(c.mode==="github"){
  var path=(c.path||"products.json").replace(/^\/+/,""),br=c.branch||"main",
  api="https://api.github.com/repos/"+c.repo+"/contents/"+path.split("/").map(encodeURIComponent).join("/"),
  h={"Authorization":"Bearer "+c.token,"Accept":"application/vnd.github+json"};
  job=fetch(api+"?ref="+encodeURIComponent(br),{headers:h}).then(function(r){if(r.status===404)return{};if(!r.ok)throw new Error("GitHub "+r.status+" - check repo name, branch and token");return r.json()})
